services:
  secrets:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    command: ["node", "/seed-secrets.ts", "${RELAY_TIME_ZONE:-UTC}", "${RELAY_HTTP_PORT:-3107}"]
    volumes:
      - db-config:/run/relay-secrets/db
      - app-config:/run/relay-secrets/app
      - reset-config:/run/relay-secrets/reset
      - jobs-config:/run/relay-secrets/jobs
      - ./apps/web/scripts/demo-secrets.ts:/seed-secrets.ts:ro

  db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD_FILE: /run/relay-secrets/db/postgres-password
    depends_on:
      secrets:
        condition: service_completed_successfully
    volumes:
      - database:/var/lib/postgresql/data
      - db-config:/run/relay-secrets/db:ro
      - ./infra/demo/init-roles.sh:/docker-entrypoint-initdb.d/10-relay-roles.sh:ro
      - ./packages/store/scripts/setup-roles.sql:/opt/relay/setup-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username relay --dbname relay"]
      interval: 2s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit:v1.29.2@sha256:030f06031ce5c60913ac9363da1ab0d4be6fd2a78147dd0e1ca0fcac665d6b34
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "0"
    volumes:
      - mail:/data
    ports:
      - "127.0.0.1:${RELAY_INBOX_PORT:-8127}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-app:local
    pull_policy: build
    init: true
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    volumes:
      - app-config:/run/relay-secrets/app:ro
    ports:
      - "${RELAY_HTTP_BIND:-127.0.0.1}:${RELAY_HTTP_PORT:-3107}:3107"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3107/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30

  resetter:
    build:
      context: .
      target: maintenance
    image: ${COMPOSE_PROJECT_NAME}-maintenance:local
    pull_policy: build
    init: true
    command: ["node", "--import", "tsx", "apps/web/scripts/demo-resetter.ts"]
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    volumes:
      - reset-config:/run/relay-secrets/reset:ro

  scheduler:
    image: ${COMPOSE_PROJECT_NAME}-maintenance:local
    pull_policy: never
    init: true
    command: ["node", "--import", "tsx", "apps/web/scripts/demo-scheduler.ts"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - jobs-config:/run/relay-secrets/jobs:ro

volumes:
  db-config:
  app-config:
  reset-config:
  jobs-config:
  database:
  mail:
